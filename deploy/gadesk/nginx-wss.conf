location = /ws/id {
    proxy_pass http://127.0.0.1:21118;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

location = /ws/relay {
    proxy_pass http://127.0.0.1:21119;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

location = /api/login-options {
    if ($request_method != GET) { return 405; }
    limit_req zone=gadesk_account burst=30 nodelay;
    include /www/server/panel/vhost/nginx/extension/gadesk.grupoamayo.com/gadesk-account-proxy.inc;
}

location = /api/oidc/auth {
    if ($request_method != POST) { return 405; }
    limit_req zone=gadesk_auth burst=10 nodelay;
    include /www/server/panel/vhost/nginx/extension/gadesk.grupoamayo.com/gadesk-account-proxy.inc;
}

location = /api/oidc/auth-query {
    if ($request_method != GET) { return 405; }
    limit_req zone=gadesk_poll burst=30 nodelay;
    include /www/server/panel/vhost/nginx/extension/gadesk.grupoamayo.com/gadesk-account-proxy.inc;
}

location = /api/oidc/callback {
    if ($request_method != GET) { return 405; }
    limit_req zone=gadesk_auth burst=10 nodelay;
    include /www/server/panel/vhost/nginx/extension/gadesk.grupoamayo.com/gadesk-account-proxy.inc;
}

location = /api/logout {
    if ($request_method != POST) { return 405; }
    limit_req zone=gadesk_account burst=30 nodelay;
    include /www/server/panel/vhost/nginx/extension/gadesk.grupoamayo.com/gadesk-account-proxy.inc;
}

location = /api/currentUser {
    if ($request_method !~ ^(GET|POST)$) { return 405; }
    limit_req zone=gadesk_account burst=30 nodelay;
    include /www/server/panel/vhost/nginx/extension/gadesk.grupoamayo.com/gadesk-account-proxy.inc;
}

location = /api/ab {
    if ($request_method !~ ^(GET|POST)$) { return 405; }
    limit_req zone=gadesk_account burst=30 nodelay;
    include /www/server/panel/vhost/nginx/extension/gadesk.grupoamayo.com/gadesk-account-proxy.inc;
}

location = /api/ab/personal {
    if ($request_method !~ ^(GET|POST)$) { return 405; }
    limit_req zone=gadesk_account burst=30 nodelay;
    include /www/server/panel/vhost/nginx/extension/gadesk.grupoamayo.com/gadesk-account-proxy.inc;
}

location = /api/ab/tags {
    if ($request_method != GET) { return 405; }
    limit_req zone=gadesk_account burst=30 nodelay;
    include /www/server/panel/vhost/nginx/extension/gadesk.grupoamayo.com/gadesk-account-proxy.inc;
}

location @gadesk_account_rate_limit {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    access_log off;
    error_log /dev/null;
    return 429 '{"error":"Too many requests; try again shortly"}';
}

location ^~ /api/ {
    default_type application/json;
    access_log off;
    error_log /dev/null;
    return 404 '{"error":"Not found"}';
}
